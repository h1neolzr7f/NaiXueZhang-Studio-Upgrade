<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nai学长工作室 产品驾驶舱</title>
  <link rel="stylesheet" href="/assets/styles.css?v=1f1b43909b" />
  <link rel="stylesheet" href="/assets/local.css?v=13692c9569" />
  <link rel="stylesheet" href="/assets/shared/site-nav.css?v=756cdf2a38" />
  <style>
    body { background:#0f1117; color:#e8eaf0; }
    .ops-wrap { max-width:1180px; margin:0 auto; padding:24px; }
    .hero { border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:24px; background:linear-gradient(135deg,#182033,#111827); }
    .hero h1 { margin:0 0 8px; font-size:28px; }
    .hero p { color:#b8c0d4; line-height:1.7; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin-top:18px; }
    .card { border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:18px; background:#151923; box-shadow:0 10px 26px rgba(0,0,0,.18); }
    .card h2 { margin:0 0 12px; font-size:18px; }
    .muted { color:#99a3ba; }
    .ok { color:#7ee787; }
    .bad { color:#ff7b72; }
    .warn { color:#f2cc60; }
    .pill { display:inline-block; padding:4px 9px; border-radius:999px; background:#232a3a; margin:3px; font-size:12px; }
    .roadmap li { margin:8px 0; }
    pre { white-space:pre-wrap; overflow:auto; background:#0b0d12; border-radius:12px; padding:12px; color:#c9d1d9; }
    a { color:#8ab4ff; }
  </style>
  <link rel="stylesheet" href="/assets/studio-theme.css?v=51de05869a" />
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
</head>
<body>
  <nav id="siteNav"></nav>
  <main class="ops-wrap">
    <section class="hero">
      <h1>产品运营驾驶舱</h1>
      <p id="positioning">加载中...</p>
      <div id="coreLoop"></div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>健康状态</h2>
        <div id="healthSummary" class="muted">加载中...</div>
      </div>
      <div class="card">
        <h2>数据规模</h2>
        <div id="dataSummary" class="muted">加载中...</div>
      </div>
      <div class="card">
        <h2>Git 风险</h2>
        <div id="gitSummary" class="muted">加载中...</div>
      </div>
      <div class="card">
        <h2>验证入口</h2>
        <div id="verifySummary" class="muted">加载中...</div>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>模块地图</h2>
        <div id="modules"></div>
      </div>
      <div class="card">
        <h2>P0-P3 路线图</h2>
        <ol id="roadmap" class="roadmap"></ol>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>原始健康快照</h2>
      <pre id="rawHealth">加载中...</pre>
    </section>
  </main>
  <script src="/assets/shared/site-nav.js?v=fe86cea773"></script>
  <script src="/assets/shared/quick-dock.js?v=5ba3a6158c"></script>
  <script src="/assets/shared/escape.js?v=cf491c2912"></script>
  <script src="/assets/shared/api-client.js?v=2a8a70c746"></script>
  <script>
    const fmtBytes = (n) => {
      if (!Number.isFinite(n)) return "-";
      const units = ["B","KB","MB","GB","TB"];
      let i = 0, v = n;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return `${v.toFixed(i ? 2 : 0)} ${units[i]}`;
    };
    function bool(v) { return v ? '<span class="ok">通过</span>' : '<span class="bad">失败</span>'; }
    async function main() {
      const [strategyPayload, healthPayload, verifyPayload] = await Promise.all([
        window.ApiClient.get("/api/product/strategy"),
        window.ApiClient.get("/api/product/health"),
        window.ApiClient.get("/api/product/verification"),
      ]);
      const strategy = strategyPayload.strategy;
      const health = healthPayload.health;
      document.getElementById("positioning").textContent = `${strategy.positioning}：${strategy.one_liner}`;
      document.getElementById("coreLoop").innerHTML = strategy.core_loop.map(x => `<span class="pill">${escapeHtml(x)}</span>`).join("");
      const checks = health.checks || {};
      document.getElementById("healthSummary").innerHTML = Object.entries(checks).map(([k,v]) => `<div>${escapeHtml(k)}: ${bool(v)}</div>`).join("");
      const data = health.data || {};
      document.getElementById("dataSummary").innerHTML = [
        `DB: ${fmtBytes(data.database && data.database.bytes || 0)}`,
        `Images: ${(data.images && data.images.files) || 0} 文件 / ${fmtBytes(data.images && data.images.bytes || 0)}`,
        `Generated: ${(data.generated && data.generated.files) || 0} 文件 / ${fmtBytes(data.generated && data.generated.bytes || 0)}`,
      ].map(x => `<div>${escapeHtml(x)}</div>`).join("");
      const git = health.git || {};
      const changed = Number(git.changed_files || 0);
      document.getElementById("gitSummary").innerHTML = git.dirty
        ? `<div class="warn">工作区有 ${escapeHtml(changed)} 个变更项，建议小步提交。</div>`
        : `<div class="ok">工作区干净。</div>`;
      const verification = verifyPayload.verification;
      document.getElementById("verifySummary").innerHTML = verification.manual_urls.map((u) => {
        const raw = String(u || "");
        const href = raw.replace("http://127.0.0.1:8797", "");
        const safe = href.startsWith("/") ? href : "#";
        return `<div><a href="${escapeHtml(safe)}" target="_blank" rel="noopener">${escapeHtml(raw)}</a></div>`;
      }).join("");
      document.getElementById("modules").innerHTML = strategy.modules.map((m) => {
        const route = String(m.route || "");
        const safeRoute = route.startsWith("/") ? route : "#";
        return `<p><b>${escapeHtml(m.name)}</b> <a href="${escapeHtml(safeRoute)}">${escapeHtml(route)}</a><br><span class="muted">${escapeHtml(m.value)}</span></p>`;
      }).join("");
      document.getElementById("roadmap").innerHTML = strategy.roadmap.map(r => `<li><b>${escapeHtml(r.phase)} ${escapeHtml(r.title)}</b><br><span class="muted">${escapeHtml((r.outcomes || []).join(" / "))}</span></li>`).join("");
      document.getElementById("rawHealth").textContent = JSON.stringify(health, null, 2);
    }
    main().catch(err => {
      document.getElementById("positioning").textContent = "加载失败：" + err.message;
    });
  </script>
</body>
</html>
