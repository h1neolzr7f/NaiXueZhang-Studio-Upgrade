name: 缺陷报告
description: 升级版运行、工作区或付费路径出现可复现问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要粘贴 NovelAI Token、Pixiv refresh token、Cookie、API Key、完整本地路径或未脱敏图库。
        需要一键包问题请改到 [稳定版仓库](https://github.com/h1neolzr7f/NaiXueZhang-Studio)。
  - type: dropdown
    id: line
    attributes:
      label: 发生在哪条产品线
      options:
        - 升级版源码（本仓库）
        - 稳定版 v1.4.0 一键包
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 Commit
      placeholder: "例如 2.0.0 或 git rev-parse --short HEAD"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开 /app/studio\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: dropdown
    id: anlas
    attributes:
      label: 是否涉及 Anlas / 付费出图
      options:
        - "否"
        - "是，但未实际扣费（force_free 或仅预检）"
        - "是，可能已扣费"
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: 提交前确认
      options:
        - label: 内容中不含 Token、Cookie、账号或私人图片
          required: true
        - label: 不是在请求绕过验证码、限流或平台访问控制
          required: true
